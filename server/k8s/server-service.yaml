apiVersion: apps/v1
kind: Deployment
metadata:
  name: server-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server-service
  template:
    metadata:
      labels:
        app: server-service
    spec:
      containers:
      - name: server-service
        image: asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/server-service:$COMMIT_SHA
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: server-service
spec:
  type: LoadBalancer
  selector:
    app: server-service
  ports:
  - protocol: TCP
    port: 8761
    targetPort: 8761
