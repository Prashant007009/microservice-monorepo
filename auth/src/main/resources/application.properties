spring.application.name=auth-service
server.port=8080

# MySQL Connector
spring.datasource.url=jdbc:mysql://gateway01.ap-northeast-1.prod.aws.tidbcloud.com:4000/microservices
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Eureka Client Configuration
# ==============================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

#Point to your Eureka Server
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# ==============================
# Instance Metadata
# ==============================
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# (Optional) How often to renew lease (heartbeat)
eureka.instance.lease-renewal-interval-in-seconds=30
eureka.instance.lease-expiration-duration-in-seconds=90

# ==============================
# Logging (optional, helps debugging)
# ==============================
logging.level.com.netflix.eureka=DEBUG
logging.level.com.netflix.discovery=DEBUG

#==============================================
# Twilio Configuration
#==============================================
twilio.accountSid=${TWILIO_SID}
twilio.authToken=${TWILIO_TOKEN}
twilio.phoneNumber=${TWILIO_PHONE}
jwt.secret=${JWT_SECRET}