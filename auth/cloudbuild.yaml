options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/auth-service:$COMMIT_SHA',
      '-f', 'auth/Dockerfile',
      'auth'
    ]

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/auth-service:$COMMIT_SHA'
    ]

images:
  - 'asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/auth-service:$COMMIT_SHA'
