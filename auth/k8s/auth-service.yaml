apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/auth-service:$COMMIT_SHA
        ports:
        - containerPort: 8080
        env:
        - name: TWILIO_SID
          valueFrom:
            secretKeyRef:
              name: twilio-sid
              key: twilio-sid
        - name: TWILIO_TOKEN
          valueFrom:
            secretKeyRef:
              name: twilio-token
              key: twilio-token
        - name: TWILIO_PHONE
          valueFrom:
            secretKeyRef:
              name: twilio-phone
              key: twilio-phone
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: jwt-secret
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: db-user
              key: db-user
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: db-pass
              key: db-pass
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
