apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      restartPolicy: Always
      containers:
      - name: auth-service
        image: asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/auth-service:$COMMIT_SHA
        ports:
        - containerPort: 8080
        env:
        - name: TWILIO_SID
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TWILIO_SID
        - name: TWILIO_TOKEN
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TWILIO_TOKEN
        - name: TWILIO_PHONE
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: TWILIO_PHONE
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: JWT_SECRET
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USER
        - name: DB_PASS
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASS
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
