options:
  logging: CLOUD_LOGGING_ONLY

substitutions:
  _IMAGE_NAME: gateway-service
  _PROJECT_ID: midyear-precept-472409-k3
  _GKE_CLUSTER: savoryroute-microservice
  _GKE_REGION: asia-south1

steps:
  # 1️⃣ Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'build',
        '-t', 'asia-south1-docker.pkg.dev/$_PROJECT_ID/my-repo/$_IMAGE_NAME:$COMMIT_SHA',
        '-f', 'api-gateway/Dockerfile',
        'api-gateway'
      ]

  # 2️⃣ Push Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      [
        'push',
        'asia-south1-docker.pkg.dev/$_PROJECT_ID/my-repo/$_IMAGE_NAME:$COMMIT_SHA'
      ]

  # 3️⃣ Update Kubernetes deployment to use the new image
  - name: 'gcr.io/cloud-builders/kubectl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Authenticate to the GKE cluster
        gcloud container clusters get-credentials $_GKE_CLUSTER \
          --region $_GKE_REGION \
          --project $_PROJECT_ID

        # Update deployment image with new commit SHA
        kubectl set image deployment/$_IMAGE_NAME \
          $_IMAGE_NAME=asia-south1-docker.pkg.dev/$_PROJECT_ID/my-repo/$_IMAGE_NAME:$COMMIT_SHA \
          --record

images:
  - 'asia-south1-docker.pkg.dev/$_PROJECT_ID/my-repo/$_IMAGE_NAME:$COMMIT_SHA'
