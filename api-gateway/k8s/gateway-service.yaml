apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
      - name: gateway-service
        image: asia-south1-docker.pkg.dev/midyear-precept-472409-k3/my-repo/gateway-service:$COMMIT_SHA
        ports:
        - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: ClusterIP
  selector:
    app: gateway-service
  ports:
  - protocol: TCP
    port: 80         # cluster internal port (other pods/API Gateway use this)
    targetPort: 8888 # maps to containerPort inside Docker
